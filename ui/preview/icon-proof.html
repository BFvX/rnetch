<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rnetch · Icon proof</title>
    <link rel="icon" type="image/png" href="../assets/rnetch-icon.png" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 30px; color: #252d3d; background: #f5f6fa; font-family: "Segoe UI", system-ui, sans-serif; }
      main { max-width: 700px; margin: auto; }
      header { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
      header img { width: 64px; height: 64px; object-fit: contain; }
      h1 { margin: 0; font-size: 30px; letter-spacing: -1px; }
      p { margin: 5px 0 0; color: #707b91; font-size: 12px; }
      section { margin-top: 16px; padding: 24px; border: 1px solid #e5e8ef; border-radius: 12px; background: #fff; }
      h2 { margin: 0 0 22px; font-size: 13px; font-weight: 600; }
      .samples { display: flex; align-items: end; justify-content: space-between; gap: 16px; }
      figure { display: grid; justify-items: center; align-content: end; gap: 14px; margin: 0; min-width: 32px; }
      figure img { display: block; }
      figcaption { color: #707b91; font-size: 11px; }
      .dark { color: #dce3ee; background: #202736; border-color: #202736; }
      .dark figcaption { color: #9ba9c2; }
      footer { margin-top: 20px; color: #707b91; font-size: 11px; line-height: 1.6; }
      a { color: #3563e9; text-decoration: none; }
      @media (max-width: 460px) { body { padding: 20px 14px; } section { padding: 18px 12px; } .samples { gap: 8px; } }
    </style>
  </head>
  <body>
    <main>
      <header><img src="../assets/rnetch-mark.png" alt="Rnetch routing mark" /><div><h1>rnetch</h1><p>A selected path. A distinct signature.</p></div></header>
      <section aria-label="Light background icon samples">
        <h2>Light surface · application icon</h2>
        <div class="samples">
          <figure><img src="../assets/rnetch.ico" alt="16 pixel icon" width="16" height="16" /><figcaption>16 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="24 pixel icon" width="24" height="24" /><figcaption>24 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="32 pixel icon" width="32" height="32" /><figcaption>32 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="48 pixel icon" width="48" height="48" /><figcaption>48 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="64 pixel icon" width="64" height="64" /><figcaption>64 px</figcaption></figure>
        </div>
      </section>
      <section class="dark" aria-label="Dark background icon samples">
        <h2>Dark surface · application icon</h2>
        <div class="samples">
          <figure><img src="../assets/rnetch.ico" alt="16 pixel icon on dark" width="16" height="16" /><figcaption>16 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="24 pixel icon on dark" width="24" height="24" /><figcaption>24 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="32 pixel icon on dark" width="32" height="32" /><figcaption>32 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="48 pixel icon on dark" width="48" height="48" /><figcaption>48 px</figcaption></figure>
          <figure><img src="../assets/rnetch.ico" alt="64 pixel icon on dark" width="64" height="64" /><figcaption>64 px</figcaption></figure>
        </div>
      </section>
      <footer>Actual exported assets at their displayed sizes. <a href="../preview.html#overview">View in the app →</a></footer>
    </main>
  </body>
</html>
